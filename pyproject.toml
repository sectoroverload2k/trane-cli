[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trane-cli"
version = "0.2.0"
description = "Command-line control of Trane Home / Nexia thermostats, including schedule editing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["nexia==2.13.0", "aiohttp"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
trane = "trane_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
